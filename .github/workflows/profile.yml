name: Update profile SVGs

on:
  schedule: # 매일 03:00 KST (= 18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_svgs.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/build_svgs.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git commit -m "chore: update profile svgs"; then
            git push
          fi
